name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install raylib fmt nlohmann-json

      - name: Check boundaries
        run: make -C tests check-boundaries

      - name: Backend smoke (NONE, RAYLIB, SOKOL)
        shell: bash
        run: |
          mkdir -p /tmp/afh-include
          ln -sfn "$GITHUB_WORKSPACE" /tmp/afh-include/afterhours
          printf '#include <afterhours/ah.h>\nint main() { return 0; }\n' > /tmp/backend_smoke.cpp
          for backend in NONE RAYLIB SOKOL; do
            echo "Compiling backend smoke ($backend)"
            clang++ -std=c++20 -Wall -Wextra \
              -DAFTER_HOURS_USE_${backend} \
              -isystem /tmp/afh-include \
              -isystem "$GITHUB_WORKSPACE/vendor" \
              -isystem "$(brew --prefix)/include" \
              -I"$(brew --prefix raylib)/include" \
              -c /tmp/backend_smoke.cpp \
              -o "/tmp/backend_smoke_${backend}.o"
          done

      - name: Build all tests
        run: make -C tests all -j4

      - name: Run all built tests
        shell: bash
        run: |
          fail=0
          for bin in output/*_test; do
            [ -x "$bin" ] || continue
            echo "Running $bin"
            "$bin" || fail=1
          done
          if [ "$fail" -ne 0 ]; then
            echo "SOME TESTS FAILED"
            exit 1
          fi

      - name: Run examples as tests
        shell: bash
        run: |
          if [ -f examples/run_all_as_tests.sh ]; then
            sh examples/run_all_as_tests.sh
          else
            make -C examples all
          fi
